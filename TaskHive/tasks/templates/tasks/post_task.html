{% extends 'tasks/base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 20px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
 <h2 style="margin-bottom: 25px; color: #333;">Post a New Task</h2>
 <form method="POST">
{% csrf_token %}
  <div style="margin-bottom: 15px;">
<label style="font-weight: bold; display: block; margin-bottom: 5px;">Task Title:</label>
<input type="text" name="title" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
  </div>
        
<div style="margin-bottom: 15px;">
<label style="font-weight: bold; display: block; margin-bottom: 5px;">Category:</label>
<select name="category" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background: white;">
    <option value="Backend">Backend</option>
    <option value="Frontend">Frontend</option>
    <option value="Design">Design</option>
    <option value="Writing">Writing</option>
    <option value="Other">Other</option>
</select>
</div>

<div style="margin-bottom: 15px;">
<label style="font-weight: bold; display: block; margin-bottom: 5px;">Budget ($):</label>
<input type="number" step="0.01" name="budget" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
</div>

<div style="margin-bottom: 20px;">
<label style="font-weight: bold; display: block; margin-bottom: 5px;">Description:</label>
<textarea name="description" rows="5" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></textarea>
</div>

<button type="submit" class="btn" style="background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Post Task</button>
</form>
</div>
{% endblock %}
