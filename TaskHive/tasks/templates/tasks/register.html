{% extends 'tasks/base.html' %}
{% block content %}
<style>
    .auth-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .auth-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }
    .auth-container p {
        margin-bottom: 15px;
    }
    .auth-container label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
    }
    .auth-container input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .auth-btn {
        width: 100%;
        padding: 10px;
        background-color: #34495e;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.3s;
    }
    .auth-btn:hover {
        background-color: #2c3e50;
    }
</style>

<div class="auth-container">
    <h2>Register</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="auth-btn">Sign Up</button>
    </form>
</div>
{% endblock %}
